<div class="container">
  <div #mapViewNode class="map-view"></div>

  <!-- Header with User Info and Logout for Authenticated Users -->
  <div class="map-header esri-widget esri-widget--panel" *ngIf="currentUser">
    <span class="user-welcome">{{ currentUser.username }}</span>
    <button class="btn-logout" (click)="logout()">Logout</button>
  </div>

  <!-- Header with Login/Signup for Guest Users -->
  <div class="map-header esri-widget esri-widget--panel" *ngIf="!currentUser">
    <span class="guest-text">Browsing as Guest</span>
    <div class="auth-buttons">
      <button class="btn-login" (click)="goToLogin()">Login</button>
      <button class="btn-signup" (click)="goToSignup()">Sign Up</button>
    </div>
  </div>

  <!-- Tourism Attraction Filter -->
  <div class="route-planner-panel esri-widget esri-widget--panel">
    <h2>Planificator Traseu</h2>
    <p class="helper-text">Adăugați locațiile concrete pe care doriți să le vizitați în România:</p>
  
    <div class="stops-list">
      <p *ngIf="selectedStops.length === 0" class="placeholder">
        Nicio locație adăugată. Utilizați harta/căutarea pentru a selecta puncte.
      </p>
      <div *ngFor="let stop of selectedStops; let i = index" class="stop-item">
        <span>{{ i + 1 }}. {{ stop.name }}</span>
        <button class="btn-remove" (click)="removeStop(i)">×</button>
      </div>
    </div>
  
    <div class="route-actions">
      <button class="btn-calculate" [disabled]="selectedStops.length < 2 || routeLoading" (click)="calculateRoute()">
        <span *ngIf="!routeLoading">
          <i class="fas fa-route"></i>
          Calculează Traseul Optim
        </span>
        <span *ngIf="routeLoading">
          <i class="fas fa-spinner fa-spin"></i>
          Se Calculează...
        </span>
      </button>
  
      <button class="btn-clear" [disabled]="selectedStops.length === 0" (click)="clearAll()">
        Șterge Tot
      </button>
    </div>
  </div>
  
  
  <div class="tourism-filter esri-widget esri-widget--panel">
    <label>
      Filter Tourist Attractions:
      <select [(ngModel)]="selectedTourismFilter" (change)="filterTourismAttractions(selectedTourismFilter)">
        <option *ngFor="let option of tourismFilterOptions" [value]="option.value">{{ option.label }}</option>
      </select>
    </label>
  </div>
</div>
